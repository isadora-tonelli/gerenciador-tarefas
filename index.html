<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <h1>Meu Kanban</h1>
       <form id="task-form">
        <input type="text" id="task-input" placeholder="Nova tarefa..." required>
        <input type="date" id="task-date-input" title="Data de entrega">
        <button type="submit">Adicionar</button>
    </form>
    </header>

    <div class="kanban-board">
      <!-- Coluna 1: Novo -->
      <div class="kanban-column" data-status="todo">
        <div class="column-header">
          <h2>Novo</h2>
          <span class="task-count" id="count-todo">0</span>
        </div>
        <div class="task-list" id="todo"></div>
      </div>

      <!-- Coluna 2: Fazendo -->
      <div class="kanban-column" data-status="doing">
        <div class="column-header">
          <h2>Fazendo</h2>
          <span class="task-count" id="count-doing">0</span>
        </div>
        <div class="task-list" id="doing"></div>
      </div>

      <!-- Coluna 3: Concluído -->
      <div class="kanban-column" data-status="done">
        <div class="column-header">
          <h2>Concluído</h2>
          <span class="task-count" id="count-done">0</span>
        </div>
        <div class="task-list" id="done"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
